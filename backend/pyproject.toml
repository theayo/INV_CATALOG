[project]
name = "invix-backend"
version = "0.1.0"
description = "INVIX catalog API and Telegram bot"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
